server:
  port: 8084

spring:
  application:
    name: hrms-leave-service

  datasource:
    url: jdbc:postgresql://localhost:5432/hrms_leave
    username: postgres
    password: 123456
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        default_schema: leave_management
        format_sql: true

  flyway:
    enabled: true
    default-schema: leave_management
    schemas: leave_management
    create-schemas: true
    locations: classpath:db/migration

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

# JWT Configuration
security:
