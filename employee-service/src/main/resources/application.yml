server:
  port: 8082

spring:
  application:
    name: hrms-employee-service

  datasource:
    url: jdbc:postgresql://localhost:${DB_PORT:5433}/hrms_demo
    username: postgres

    password: Hitesh@2001

    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        default_schema: hrms

  flyway:
    enabled: true
    schemas: hrms
    default-schema: hrms
    create-schemas: true

  jackson:
    serialization:
      fail-on-empty-beans: false

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true