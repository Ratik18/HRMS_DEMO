
server:
  port: 8080

spring:
  application:
    name: hrms-api-gateway

  cloud:
    gateway:
      server:
        webmvc:
          routes:

            # Auth Service
            - id: auth-service
              uri: lb://hrms-auth-service
              predicates:
                - Path=/api/auth/**

            # Employee Service
            - id: employee-service
              uri: lb://hrms-employee-service
              predicates:
                - Path=/api/employees/**

            # Department Service
            - id: department-service
              uri: lb://hrms-employee-service
              predicates:
                - Path=/api/departments/**

            # Designation Service
            - id: designation-service
              uri: lb://hrms-employee-service
              predicates:
                - Path=/api/designations/**

            # Onboarding Service
            - id: onboarding-service
              uri: lb://hrms-employee-service
              predicates:
                - Path=/api/onboarding/**

eureka:
  instance:
    prefer-ip-address: true

  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8761/eureka/
