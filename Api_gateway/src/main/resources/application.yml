server:
  port: 8080

spring:
  application:
    name: hrms-api-gateway

  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: auth-service
              uri: lb://hrms-auth-service
              predicates:
                - Path=/api/auth/**

            - id: employees
              uri: lb://hrms-employee-service
              predicates:
                - Path=/api/employees/**

            - id: departments
              uri: lb://hrms-employee-service
              predicates:
                - Path=/api/departments/**

            - id: designations
              uri: lb://hrms-employee-service
              predicates:
                - Path=/api/designations/**

            - id: onboarding
              uri: lb://hrms-employee-service
              predicates:
                - Path=/api/onboarding/**

eureka:
  instance:
    prefer-ip-address: true
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8761/eureka/