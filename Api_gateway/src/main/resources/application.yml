server:
  port: 8080

spring:
  application:
    name: hrms-api-gateway

  cloud:
    gateway:

      # CORS Configuration
      globalcors:
        add-to-simple-url-handler-mapping: true
        cors-configurations:
          '[/**]':
            allowedOrigins:
              - "http://localhost:5173"
            allowedMethods:
              - GET
              - POST
              - PUT
              - PATCH
              - DELETE
              - OPTIONS
            allowedHeaders:
              - "*"
            allowCredentials: false
            maxAge: 3600

      # API Gateway Routes
      routes:
        - id: auth-service
          uri: lb://hrms-auth-service
          predicates:
            - Path=/api/auth/**

        - id: employee-service
          uri: lb://hrms-employee-service
          predicates:
            - Path=/api/employees/**

eureka:
  instance:
    prefer-ip-address: true

  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8761/eureka/