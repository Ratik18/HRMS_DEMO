server:
  port: 8083

spring:
  application:
    name: hrms-attendance-service

  datasource:
    url: jdbc:postgresql://localhost:5432/hrms_attendance
    username: postgres
    password: Bhumi@570
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        default_schema: attendance
        format_sql: true

  flyway:
    enabled: true
    default-schema: attendance
    schemas: attendance
    create-schemas: true
    locations: classpath:db/migration

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true

  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

  endpoint:
    health:
      show-details: always

jwt:
  secret: "M8dDrAhLNmE/xMi6+szGqcR+7xcNm9rxD7kDpz806LM="
