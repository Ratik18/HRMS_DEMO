server:
  port: 8081

spring:
  application:
    name: hrms-auth-service

  datasource:
    url: jdbc:postgresql://localhost:${DB_PORT:5433}/hrms_auth_db
    username: postgres
    password: Subha@123
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        default_schema: auth

  flyway:
    enabled: true
    locations: classpath:db/migration
    default-schema: auth
    schemas: auth
    create-schemas: true
    baseline-on-migrate: true
    baseline-version: 0

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8761/eureka/

security:
  jwt:
    secret: FfibNfnZQbrlWQmmCt7aXnvSOtM0T3KLkpB350V+M/Y=
    expiration-ms: 3600000